<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Poemly · 诗阁</title>
<link rel="icon" href="poemly_favicon.ico">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:"Microsoft YaHei",serif; background:#f4f1ea; height:100vh; display:flex; flex-direction:column; }
header { background:#2c3e50; color:#f9f4e6; padding:14px 24px; display:flex; justify-content:space-between; align-items:center; }
header h1 { font-size:20px; font-weight:600; letter-spacing:6px; }
header span { font-size:12px; opacity:.6; }
#chat { flex:1; overflow-y:auto; padding:24px; max-width:820px; width:100%; margin:0 auto; }
.msg { margin-bottom:20px; display:flex; }
.msg.user { justify-content:flex-end; }
.msg.ai { gap:10px; align-items:flex-start; }
.msg.ai .avt { width:34px; height:34px; border-radius:50%; border:1.5px solid #d8b96a; background:#f4f1ea; flex-shrink:0; margin-top:2px; }
.welcome { text-align:center; padding:30px 12px 14px; }
.welcome img { width:180px; border-radius:20px; box-shadow:0 6px 24px rgba(90,74,45,.18); }
.welcome h2 { margin-top:16px; font-size:20px; letter-spacing:5px; color:#2c3e50; }
.welcome p { margin-top:8px; font-size:13px; color:#8a8271; line-height:2; }
.bubble { max-width:75%; padding:12px 18px; border-radius:12px; line-height:1.8; font-size:15px; white-space:pre-wrap; }
.msg.user .bubble { background:#2c3e50; color:#f9f4e6; border-bottom-right-radius:4px; }
.msg.ai .bubble { background:#fff; color:#2c2c2c; border-bottom-left-radius:4px; box-shadow:0 1px 3px rgba(0,0,0,.08); }
.msg.ai .bubble em { color:#8a6d3b; font-style:normal; font-size:.9em; display:block; margin-top:6px; padding-top:6px; border-top:1px dashed #d8d2c4; }
#inputbar { background:#fff; padding:14px 24px; border-top:1px solid #e5e0d4; display:flex; gap:12px; max-width:820px; width:100%; margin:0 auto; }
#q { flex:1; border:1px solid #ccc; border-radius:8px; padding:10px 16px; font-size:15px; font-family:inherit; outline:none; }
#q:focus { border-color:#2c3e50; }
#send { background:#2c3e50; color:#f9f4e6; border:none; border-radius:8px; padding:10px 28px; font-size:15px; cursor:pointer; font-family:inherit; }
#send:disabled { background:#999; cursor:not-allowed; }
#clear { background:none; border:1px solid #ccc; border-radius:8px; padding:10px 14px; font-size:13px; color:#666; cursor:pointer; font-family:inherit; }
.tag { font-size:11px; color:#999; margin-top:4px; }
</style>
</head>
<body>
<header>
  <h1>Poemly · 诗阁</h1>
  <span style="display:flex;gap:14px;align-items:center;">
    <button id="metertoggle" onclick="toggleMeter()" style="background:none;border:1px solid #56718a;color:#cfe0ee;border-radius:6px;padding:4px 10px;font-size:12px;cursor:pointer;font-family:inherit;">平仄自查：开</button>
    <span>自训诗词模型 · 独立创作 · 平水韵</span>
  </span>
</header>
<div id="chat"></div>
<form id="inputbar">
  <input id="q" placeholder="出题吧，例如：以《春雨》为题作一首七言绝句" autocomplete="off" autofocus>
  <button id="send" type="submit">发送</button>
  <button id="clear" type="button" onclick="localStorage.clear();location.reload()">清空</button>
</form>
<script>
const PERSONA = "你是poemly，一位精通古典诗词的创作助手。用韵依平水韵，讲究平仄对仗，先立意后作诗，写完逐联解意象。作诗必须独立创作，绝不抄录古人现成诗句；只有用户要求默写时才引原作。";
let history = JSON.parse(localStorage.getItem("poemly_hist") || "[]");
const chat = document.getElementById("chat");

// 上下文瘦身：发往模型的历史里，较早的诗歌回答只保留"诗体"，立意/意象解释不入上下文；
// 最近 KEEP_FULL 条回答保留全文（用户追问"第二句什么意思"时上下文里有完整解释可依）
const KEEP_FULL = 2;
function slimAssistant(t) {
  if (!t) return t;
  try {
    const ie = t.indexOf("意象解释");
    if (ie === -1) return t;              // 非诗歌回答：保留原文
    let body = t.slice(0, ie);
    const m = body.match(/(?:^|\n)\s*诗[：:]?/) || body.match(/(?:^|\n)\s*词[：:]?/);   // 定位"诗/词"段落起始行
    if (!m) return t;
    return body.slice(m.index).replace(/\n{3,}/g, "\n\n").trim();
  } catch (e) { return t; }
}

// D2 多轮连贯：首条用户消息作锚（长会话不失设定）+ 最近 WINDOW 条
const WINDOW = 14;
function buildMsgs() {
  const recent = history.slice(-WINDOW);
  const anchor = (history.length > WINDOW && history[0] && history[0].role === "user") ? [history[0]] : [];
  const fullFrom = recent.length - KEEP_FULL;
  const msgs = anchor.concat(recent).map((m, i, arr) => ({
    role: m.role,
    content: (m.role === "assistant" && i < arr.length - KEEP_FULL) ? slimAssistant(m.content) : m.content
  }));
  return msgs;
}

function add(cls, text) {
  const d = document.createElement("div");
  d.className = "msg " + cls;
  if (cls === "ai") {
    const av = document.createElement("img");
    av.className = "avt";
    av.src = "poemly_avatar.png";
    av.alt = "Poemly";
    d.appendChild(av);
  }
  const b = document.createElement("div");
  b.className = "bubble";
  b.textContent = text;
  d.appendChild(b);
  chat.appendChild(d);
  chat.scrollTop = chat.scrollHeight;
  return b;
}

// D3 平仄自查开关（默认开，localStorage 记忆）
let meterOn = localStorage.getItem("poemly_meter") !== "off";
function toggleMeter() {
  meterOn = !meterOn;
  localStorage.setItem("poemly_meter", meterOn ? "on" : "off");
  document.getElementById("metertoggle").textContent = "平仄自查：" + (meterOn ? "开" : "关");
}
if (!meterOn) document.getElementById("metertoggle").textContent = "平仄自查：关";

// 单次流式请求（复用同一代理），返回全文；onDelta 用于实时刷新气泡
async function askStream(msgs, system, maxTokens, onDelta) {
  const r = await fetch("http://127.0.0.1:11499/v1/messages", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ model: "poemly-v22", max_tokens: maxTokens || 896, stream: true, system: system, messages: msgs })
  });
  const reader = r.body.getReader();
  const dec = new TextDecoder();
  let acc = "", buf = "";
  while (true) {
    const { done, value } = await reader.read();
    if (done) break;
    buf += dec.decode(value, { stream: true });
    for (const line of buf.split("\n")) {
      if (!line.startsWith("data:")) continue;
      try {
        const ev = JSON.parse(line.slice(5));
        if (ev.type === "content_block_delta" && ev.delta && ev.delta.type === "text_delta") {
          acc += ev.delta.text;
          if (onDelta) onDelta(acc);
        }
      } catch (_) {}
    }
    buf = buf.slice(buf.lastIndexOf("\n") + 1);
  }
  return acc;
}

// D3：创作类回答自动平仄自查，失律则重写。返回 {text, note}
async function meterCheck(userQ, aiText) {
  const isCreation = /(?:诗|词)：\n《/.test(aiText);
  if (!meterOn || !isCreation) return { text: aiText, note: "" };
  const kind = /词：\n《/.test(aiText) ? "词依词林正韵" : "诗依平水韵";
  try {
    const report = await askStream(
      [{ role: "user", content: userQ }, { role: "assistant", content: aiText },
       { role: "user", content: `请按${kind}的要求，逐字检查上面作品的平仄与韵脚，只报告结论：若无失律，回答「格律无误」；若有，逐处指出。` }],
      PERSONA, 300);
    const bad = /失律|出韵|不合|错|误|问题/.test(report) && !/格律无误/.test(report);
    if (!bad) return { text: aiText, note: "已自查平仄 ✓ 无失律" };
    const fixed = await askStream(
      [{ role: "user", content: userQ }, { role: "assistant", content: aiText },
       { role: "user", content: `上面的作品经自查存在失律。请保持原格式与立意，把失律处修正后重写全文。` }],
      PERSONA, 896);
    return (fixed && /(?:诗|词)：\n《/.test(fixed))
      ? { text: fixed, note: "已自查平仄 ✓ 发现失律，已自动修正" }
      : { text: aiText, note: "已自查平仄 ⚠ 存在失律，重写失败" };
  } catch (e) {
    return { text: aiText, note: "" };
  }
}
if (history.length) {
  history.forEach(m => add(m.role === "user" ? "user" : "ai", m.content));
} else {
  const w = document.createElement("div");
  w.className = "welcome";
  w.innerHTML = '<img src="poemly_standing.png" alt="Poemly">'
    + '<h2>Poemly · 诗阁</h2>'
    + '<p>自训诗词模型 v2.2 · 独立创作 · 平水韵 · 亦可填词<br>出题便是——五言七言、绝句律诗、十六字令到浣溪沙皆可，查韵问典亦无不可。</p>';
  chat.appendChild(w);
}

document.getElementById("inputbar").onsubmit = async (e) => {
  e.preventDefault();
  const q = document.getElementById("q").value.trim();
  if (!q) return;
  document.getElementById("q").value = "";
  add("user", q);
  history.push({ role: "user", content: q });
  const bub = add("ai", "…");
  document.getElementById("send").disabled = true;
  try {
    const acc = await askStream(buildMsgs(), PERSONA, 896, t => { bub.textContent = t || "…"; chat.scrollTop = chat.scrollHeight; });
    bub.textContent = acc || "（空响应）";
    chat.scrollTop = chat.scrollHeight;
    // D3 平仄自查（创作类回答才触发）
    const { text, note } = await meterCheck(q, acc || "");
    bub.textContent = text;
    if (note) {
      const em = document.createElement("em");
      em.textContent = note;
      bub.appendChild(em);
    }
    history.push({ role: "assistant", content: text });
    localStorage.setItem("poemly_hist", JSON.stringify(history.slice(-40)));
  } catch (err) {
    bub.textContent = "连接失败：" + err.message + "\n（代理可能未运行，稍等再试或重启电脑）";
    // 失败时回滚：把刚 push 的 user 消息移除，让用户可以重发
    if (history.length && history[history.length - 1].role === "user") {
      history.pop();
      localStorage.setItem("poemly_hist", JSON.stringify(history.slice(-40)));
    }
  }
  document.getElementById("send").disabled = false;
  document.getElementById("q").focus();
};
</script>
</body>
</html>
